name: Temporary Magellan portrait import
on:
  push:
    branches:
      - feat/v0422-magellan-user-image
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0422-magellan-user-image
          persist-credentials: true
      - name: Install Pillow for source verification
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Reproduce the uploaded artwork crop from a public OPTC source
        run: |
          python - <<'PY'
          import base64, hashlib, io, pathlib, urllib.request, math, sys
          from PIL import Image
          url = 'https://i.pinimg.com/736x/10/1b/90/101b90de662edebb50eb2157c94ac9b3--prison-one-piece.jpg'
          target_thumb = base64.b64decode('')
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=30) as response:
              source=Image.open(io.BytesIO(response.read())).convert('RGB')
          print('SOURCE',source.size)
          W,H=source.size
          desired=(499,400)
          def loss(im):
              thumb=im.resize((12,10),Image.Resampling.BILINEAR).tobytes()
              return sum((a-b)**2 for a,b in zip(thumb,target_thumb))/len(target_thumb)
          best=None
          for width in range(max(200,W-100), W+1, 4):
              height=round(width*400/499)
              if height>H:continue
              for y in range(0,H-height+1,4):
                  for x in range(0,W-width+1,4):
                      box=(x,y,x+width,y+height)
                      im=source.crop(box)
                      score=loss(im)
                      if best is None or score<best[0]:best=(score,box)
          if best is None:sys.exit('No candidate found')
          print('BEST PIXEL MATCH',best,'RMSE=',math.sqrt(best[0]))
          if math.sqrt(best[0])>75:
              sys.exit('Source crop does not resemble the uploaded artwork. No image will be committed.')
          output=pathlib.Path('public/images/characters/magellan-v0422.png')
          output.parent.mkdir(parents=True,exist_ok=True)
          source.crop(best[1]).resize(desired,Image.Resampling.LANCZOS).save(output,format='PNG',optimize=True)
          data=output.read_bytes()
          print('IMAGE STAGED',output,len(data),'SHA256',hashlib.sha256(data).hexdigest())
          PY
      - name: Commit the artwork image to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/characters/magellan-v0422.png
          if ! git diff --cached --quiet; then
            git commit -m "asset: add verified Magellan poison-art portrait"
            git push origin HEAD:feat/v0422-magellan-user-image
          fi
