name: v0.4.21 Download exact original Magellan PNG
on:
  push:
    branches:
      - feat/v0421-magellan-portrait-lossless
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-exact-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0421-magellan-portrait-lossless
      - name: Install pixel integrity checker
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Inspect remote candidate PNG and compare full RGBA pixels
        run: |
          python - <<'PY'
          import hashlib, urllib.request, pathlib, sys, io
          from PIL import Image
          dest = pathlib.Path('public/images/characters/magellan-v0421.png')
          want = '9b7e0c14f0b1407e4e88e2ee7e17cb34875dd53203c717d56e4eed22d687f76a'
          pixel_want = 'b20d92b4706166e1a10c38155b944086489d612898869aa2fd614f31dd3da7ef'
          if dest.exists() and hashlib.sha256(dest.read_bytes()).hexdigest()==want:
              print('EXACT USER ORIGINAL ALREADY PRESENT')
              sys.exit(0)
          candidates = [
            'https://cdn.shopify.com/s/files/1/0609/7122/1152/files/tl8KXQz.png?v=1675118901',
            'https://one-piece-artworks.com/app/view/assets/img/0PFzBaX',
            'https://one-piece-artworks.com/app/view/assets/img/0PFzBaX.png',
          ]
          for url in candidates:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      binary=response.read()
                  sha=hashlib.sha256(binary).hexdigest()
                  im=Image.open(io.BytesIO(binary))
                  px_hash=hashlib.sha256(im.convert('RGBA').tobytes()).hexdigest()
                  print('CANDIDATE',url,'size=',len(binary),'sha256=',sha,'pixels=',px_hash,'dimensions=',im.size,'mode=',im.mode,'png=',binary[:8].hex())
                  if sha == want:
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(binary)
                      print('EXACT ORIGINAL FOUND, STAGED.')
                      break
              except Exception as e:
                  print('CANDIDATE ERROR',url,repr(e))
          if not dest.exists() or hashlib.sha256(dest.read_bytes()).hexdigest()!=want:
              print('No exact byte-identical image found. Refusing substitutes.')
              sys.exit(1)
          PY
      - name: Push exact original PNG to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/characters/magellan-v0421.png
          if git diff --cached --quiet; then
            echo "Exact file already in branch."
          else
            git commit -m "asset: add byte-identical full-quality Magellan original PNG"
            git push origin HEAD:feat/v0421-magellan-portrait-lossless
          fi
