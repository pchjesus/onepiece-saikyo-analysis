name: v0.4.1 one-time matching portrait asset import
on:
  push:
    branches: [feat/v0.4.1-portrait-fixes-luffy]
    paths: [.github/workflows/v041-portrait-import.yml]
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - name: Retrieve matching user-supplied art from public artwork sources
        run: |
          python - <<'PY'
          import io, pathlib, requests
          from PIL import Image, ImageOps
          target = pathlib.Path('public/images/characters')
          target.mkdir(parents=True, exist_ok=True)
          urls = {
            'buggy': [
              'https://one-piece-artworks.com/app/view/assets/img/BlqAnyy',
              'https://one-piece-artworks.com/app/view/assets/img/BlqAnyy.png',
            ],
            'luffy': [
              'https://pbs.twimg.com/media/HJdnZZiXsAA5TE9?format=png&name=orig',
              'https://pbs.twimg.com/media/HJdnZZiXsAA5TE9.png',
            ],
          }
          headers = {'User-Agent':'Mozilla/5.0 (compatible; OnePieceArtworkAudit/1.0)'}
          for name, candidates in urls.items():
            last = None
            for url in candidates:
              try:
                response = requests.get(url, headers=headers, timeout=30)
                print(name, url, response.status_code, response.headers.get('Content-Type'), len(response.content))
                response.raise_for_status()
                im = Image.open(io.BytesIO(response.content))
                im.load()
                if min(im.size) < 250: raise ValueError('Not a full illustration')
                im = ImageOps.exif_transpose(im).convert('RGBA')
                im.thumbnail((920, 920), Image.Resampling.LANCZOS)
                dest = target / f'{name}.webp'
                im.save(dest, format='WEBP', quality=83, method=6)
                print('saved', dest, im.size, dest.stat().st_size)
                last = None
                break
              except Exception as error:
                last = error
                print('FAILED', str(error))
            if last: raise RuntimeError(f'Missing {name} artwork') from last
          PY
      - name: Commit portrait assets once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/characters/buggy.webp public/images/characters/luffy.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets(v0.4.1): import matching user-provided Buggy and Luffy illustrations"
          git push origin HEAD:feat/v0.4.1-portrait-fixes-luffy
